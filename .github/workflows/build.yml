name: KernelSU Next module
on:
  push:
    branches: [feature/ksu-next-foundation]
  pull_request:
    branches: [feature/ksu-next-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript and configuration logic
        run: |
          node --check webroot/core.js
          node --check webroot/app.js
          node --check webroot/ui.js
          node --check webroot/colors.js
          node --check webroot/feedback.js
          node --check webroot/startup.js
          node --test tests/*.test.js
      - name: Validate shell scripts and module metadata
        run: |
          for f in customize.sh service.sh boot-completed.sh; do sh -n "$f"; done
          test -f module.prop
          grep -q '^id=language_selector_ksu$' module.prop
          test -f webroot/index.html
      - name: Install browser QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.60.0
          npx playwright install --with-deps chromium
      - name: Browser UI regression and screenshots
        env:
          LS_SCREENSHOT_DIR: ui-qa
        run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-selector-webui-qa
          path: ui-qa/
          if-no-files-found: ignore
      - name: Package KernelSU module
        run: |
          mkdir -p dist/module
          cp -R module.prop customize.sh boot-completed.sh uninstall.sh webroot docs dist/module/
          (cd dist/module && zip -qr ../module-check.zip .)
          unzip -t dist/module-check.zip
          unzip -l dist/module-check.zip
      - uses: actions/upload-artifact@v4
        with:
          name: language-selector-ksu-next-module
          path: dist/module/
          if-no-files-found: error
